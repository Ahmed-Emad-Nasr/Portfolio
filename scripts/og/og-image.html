<!-- The share card. To regenerate public/og-image.png, open this file in Chrome at 1200x630 and take a screenshot (or Playwright: viewport 1200x630, page.screenshot). Fonts load from scripts/og/fonts. -->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Dela;src:url(fonts/dela-gothic-one.woff2)}
@font-face{font-family:Yuji;src:url(fonts/yuji-syuku.woff2)}
@font-face{font-family:Mono;src:url(fonts/jetbrains-mono-latin.woff2);font-weight:100 800}
@font-face{font-family:Outfit;src:url(fonts/outfit-latin.woff2);font-weight:100 900}
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#080808;color:#fff;font-family:Outfit;position:relative;overflow:hidden}
.grid{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(255,255,255,.07) 1px,transparent 0);background-size:40px 40px}
.top{position:absolute;top:0;left:0;right:0;height:4px;background:#BC002D}
.sun{position:absolute;right:-60px;top:50%;transform:translateY(-50%);width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,rgba(188,0,45,.22) 0%,rgba(188,0,45,.12) 40%,transparent 70%)}
.kanji{position:absolute;right:70px;top:60px;display:flex;gap:28px;font-family:Yuji;font-size:132px;line-height:1.15;color:rgba(255,255,255,.06);writing-mode:vertical-rl;text-orientation:upright}
.wrap{position:absolute;left:80px;top:80px;right:80px}
.badge{display:inline-flex;align-items:center;gap:14px;padding:12px 18px;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.03);font-family:Mono,"Noto Sans CJK JP","Noto Sans JP",sans-serif;font-size:15px;font-weight:700;letter-spacing:.3em;color:#a0a0a0;text-transform:uppercase}
.dot{width:10px;height:10px;background:#BC002D}
h1{margin-top:34px;font-family:Dela;font-size:118px;line-height:.88;letter-spacing:-.04em;text-transform:uppercase}
.s{display:block;color:transparent;-webkit-text-stroke:3px #BC002D;margin-left:40px}
.role{margin-top:30px;font-family:Mono;font-size:22px;font-weight:700;letter-spacing:.28em;color:#FFD700;text-transform:uppercase}
.areas{margin-top:14px;font-family:Mono;font-size:15px;font-weight:600;letter-spacing:.18em;color:rgba(255,255,255,.55);text-transform:uppercase}
.foot{position:absolute;left:80px;right:80px;bottom:56px;display:flex;justify-content:space-between;align-items:center;font-family:Mono;font-size:17px;letter-spacing:.25em;color:rgba(255,255,255,.45);text-transform:uppercase}
.mark{font-family:Dela;font-size:34px;letter-spacing:-.02em;color:#fff}.mark i{color:#BC002D;font-style:normal}
.seal{position:absolute;right:120px;bottom:130px;width:92px;height:92px;background:#BC002D;transform:rotate(6deg);display:flex;align-items:center;justify-content:center;font-family:Yuji;font-size:40px;color:#fff;box-shadow:0 0 40px rgba(188,0,45,.5)}
.seal:before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.45)}
</style></head><body>
<div class="grid"></div><div class="sun"></div><div class="top"></div>
<div class="kanji"><span>アナリスト</span><span>村長</span></div>
<div class="wrap">
 <div class="badge" lang="ja"><span class="dot"></span>情報セキュリティ · GRC · SOC · DFIR · IAM</div>
 <h1>Ahmed<span class="s">Emad Nasr</span></h1>
 <div class="role">Information Security Officer</div>
 <div class="areas">GRC &amp; Compliance · Security Operations · DFIR · IAM &amp; Data Security</div>
</div>
<div class="seal">村長</div>
<div class="foot"><span class="mark">AE<i>.</i></span><span>ahmed-emad-nasr.github.io/Portfolio</span></div>
</body></html>
