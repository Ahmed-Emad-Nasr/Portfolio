# .github/workflows/verify.yml
#
# Runs the same checks as `npm run verify` on every push and pull request.
#
# Why does this matter? Because most of the problems that reached production in this project weren't
# logic errors — they were broken links and assets: an id with spaces, a card linking to
# a page that was never generated, an asset path changed in code but not on disk. All of
# these pass TypeScript and next build successfully.
#
# ── A note on how this file is designed ───────────────────────────────────
# The first version stopped at the first failing step. That was a mistake: you wait a minute
# to learn about one problem, fix it, push, wait again... for a second error you could
# have learned about in the same run.
#
# Now every check runs with `if: always()`, and a final step collects
# the results and fails if any of them failed. One run = every problem at once.

name: Verify

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:   # so you can run it manually from the Actions tab

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Environment
        run: |
          echo "node $(node -v) · npm $(npm -v)"
          echo "public/ exists: $([ -d public ] && echo yes || echo NO)"

      - name: Install dependencies
        id: install
        run: |
          npm ci || {
            echo "::error title=Install failed::npm ci failed. If it says the lockfile is out of sync, run 'npm install' locally and commit package-lock.json."
            exit 1
          }

      # ── From here on: every check runs even if the previous one failed ────

      - name: Lint
        id: lint
        if: always() && steps.install.outcome == 'success'
        run: npm run lint

      - name: Type check
        id: types
        if: always() && steps.install.outcome == 'success'
        run: npm run type-check

      # The three static audits that `npm run verify` runs and this workflow
      # used to skip: CSS (dead classes/tokens, duplicate files, expensive
      # properties), cross-file data integrity, and responsive rules.
      - name: CSS audit
        id: css
        if: always() && steps.install.outcome == 'success'
        run: npm run check:css

      - name: Data audit
        id: data
        if: always() && steps.install.outcome == 'success'
        run: npm run check:data

      - name: Responsive audit
        id: responsive
        if: always() && steps.install.outcome == 'success'
        run: npm run check:responsive

      # Confirms every Assets/ path in the config actually exists in public/.
      # Catches: a renamed folder, a PDF never uploaded, a deleted image, and
      # upper/lower-case mismatches (works on Windows, breaks on GitHub Pages).
      - name: Check assets exist in public/
        id: assets
        if: always() && steps.install.outcome == 'success'
        run: npm run check:assets

      - name: Build
        id: build
        if: always() && steps.install.outcome == 'success'
        run: npm run build

      # Crawls out/ and confirms every internal link resolves to an existing file
      - name: Check internal links
        id: links
        if: always() && steps.build.outcome == 'success'
        run: npm run check:links

      - name: Upload build output
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 5

      # ── Summary: every result in one place ────────────────────────────────
      - name: Summary
        if: always()
        run: |
          status() { [ "$1" = "success" ] && echo "✅ pass" || { [ "$1" = "skipped" ] && echo "⏭️ skipped" || echo "❌ FAIL"; }; }

          {
            echo "## Verify results"
            echo ""
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| Lint | $(status '${{ steps.lint.outcome }}') |"
            echo "| Type check | $(status '${{ steps.types.outcome }}') |"
            echo "| CSS audit | $(status '${{ steps.css.outcome }}') |"
            echo "| Data audit | $(status '${{ steps.data.outcome }}') |"
            echo "| Responsive audit | $(status '${{ steps.responsive.outcome }}') |"
            echo "| Assets exist in public/ | $(status '${{ steps.assets.outcome }}') |"
            echo "| Build | $(status '${{ steps.build.outcome }}') |"
            echo "| Internal links | $(status '${{ steps.links.outcome }}') |"
            echo ""
            echo "Open the failing step above for the full output."
          } >> "$GITHUB_STEP_SUMMARY"

          # Fail if any check failed
          for r in '${{ steps.lint.outcome }}' '${{ steps.types.outcome }}' \
                   '${{ steps.css.outcome }}' '${{ steps.data.outcome }}' \
                   '${{ steps.responsive.outcome }}' \
                   '${{ steps.assets.outcome }}' '${{ steps.build.outcome }}' \
                   '${{ steps.links.outcome }}'; do
            [ "$r" = "failure" ] && exit 1
          done
          exit 0
